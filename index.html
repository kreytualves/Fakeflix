<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Seleção de Perfil</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <header>
            <h1>Quem está assistindo?</h1>
            <button id="theme-toggle" aria-label="Alternar modo escuro/claro">🌙</button>
        </header>

        <ul class="profiles" aria-label="Seleção de perfis">
            <li>
                <article class="profile" role="button" tabindex="0">
                    <figure>
                        <img src="./assets/perfil-1.jpg" alt="Um jovem de estilo gótico em animação de massinha segura uma chave dourada em um cenário lúdico e sombrio.">
                        <figcaption>Kleyton</figcaption>
                    </figure>
                </article>
            </li>
            <li>
                <article class="profile" role="button" tabindex="0">
                    <figure>
                        <img src="./assets/perfil-3.jpg" alt="Uma jovem de estilo moderno em uma cena realista.">
                        <figcaption>Paloma</figcaption>
                    </figure>
                </article>
            </li>
            <li>
                <article class="profile" role="button" tabindex="0">
                    <figure>
                        <img src="./assets/perfil-4.jpg" alt="Uma jovem de estilo vintage em um cenário nostálgico.">
                        <figcaption>Keyla</figcaption>
                    </figure>
                </article>
            </li>
            <li>
                <article class="profile" role="button" tabindex="0">
                    <figure>
                        <img src="./assets/perfil-2.jpg" alt="Imagem de um boné azul">
                        <figcaption>Seu nene</figcaption>
                    </figure>
                </article>
            </li>
        </ul>
    </main>
</body>
</html>
